[package]
name = "ahda"
version = "0.1.0"
edition = "2021"
description = "Pseudoalignment compression and conversion between formats."
readme = "README.md"
homepage = "https://docs.rs/ahda"
repository = "https://codeberg.org/themaklin/ahda"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:needletail", "dep:stderrlog"]
cxxbridge = ["dep:cxx", "dep:cxx-build"]

[[bin]]
name = "ahda"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
## cli
clap = { version = "4", features = ["derive"], optional = true}
needletail = { version = "0.6", default-features = false, features = ["flate2"], optional = true }
stderrlog = { version = "0.6", optional = true }

## core
bincode = "2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
indexmap = "2.14"
roaring = "0.11"

## .sam formatting
bstr = "1.12"
noodles-sam = "0.78"

## C++ API
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[profile.release]
debug = true
lto = true
codegen-units = 1
